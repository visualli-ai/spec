name: Deploy Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  build-and-deploy-docs:
    name: Build & Deploy Docs to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: make install

      - name: Install SDK dependencies
        run: cd renderers/visualli-sdk && npm install

      - name: Build SDK packages
        run: cd renderers/visualli-sdk && npx turbo run build

      - name: Build Docs
        run: make docs-build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 pages deploy site --project-name=spec-visualli-ai --branch main
