name: Visualli CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-build:
    name: Verify and Build All
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # 1. Install all dependencies (Speed optimized)
      - name: Install dependencies
        run: |
          make install
          cd renderers/visualli-sdk && npm install

      # 2. Verify Bindings & Version Propagation
      - name: Verify bindings and version propagation
        run: |
          make update-version
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Bindings or version propagation are not up to date. Run 'make update-version' locally."
            git status
            git diff
            exit 1
          fi

      # 3. Build Bindings & Packages (@visualli/bindings, @visualli/core, @visualli/react, etc.)
      - name: Build All
        run: |
          # Build Python Bindings
          pip install build
          cd bindings/python && python -m build
          cd ../../
          
          # Build TS Bindings & SDK
          cd bindings/typescript && npm install && npm run build
          cd ../../renderers/visualli-sdk && npm run build
          
          # Build Try-It-Out Bundle
          cd ../../
          make build-loader

      # 4. Build Documentation
      - name: Build MkDocs Site
        run: |
          make docs-build

      # 5. Archive artifacts for publishing jobs
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bindings/python/dist
            bindings/typescript/dist
            renderers/visualli-sdk/sdk/*/dist
            site
          retention-days: 1

  publish-pypi-bindings:
    name: Publish Python Bindings (PyPI)
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - name: Publish Python Bindings to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist/
          skip-existing: true

  publish-npm-bindings:
    name: Publish TypeScript Bindings (NPM)
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - name: Publish TypeScript Bindings to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          VERSION=$(node -p "require('./package.json').version")
          if npm view @visualli/bindings@$VERSION version --auth-type=legacy >/dev/null 2>&1; then
            echo "Version $VERSION already exists on NPM. Skipping."
          else
            npm publish --access public --ignore-scripts --provenance
          fi

  publish-packages:
    name: Publish SDK Packages (@visualli/core, @visualli/react)
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Publish Core Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd renderers/visualli-sdk/sdk/core
          VERSION=$(node -p "require('./package.json').version")
          if npm view @visualli/core@$VERSION version --auth-type=legacy >/dev/null 2>&1; then
            echo "Version $VERSION already exists on NPM. Skipping."
          else
            npm publish --access public --ignore-scripts --provenance
          fi

      - name: Publish React Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd renderers/visualli-sdk/sdk/react
          VERSION=$(node -p "require('./package.json').version")
          if npm view @visualli/react@$VERSION version --auth-type=legacy >/dev/null 2>&1; then
            echo "Version $VERSION already exists on NPM. Skipping."
          else
            npm publish --access public --ignore-scripts --provenance
          fi

  build-and-publish-docs:
    name: Publish Docs to Cloudflare Pages
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Verify Docs Artifact
        run: |
          ls -R site
          if [ ! -d "site" ]; then
            echo "Error: site directory not found"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy site --project-name=spec-visualli-ai --branch main
