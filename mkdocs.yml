site_name: Visualli Spec
site_url: https://spec.visualli.ai

repo_url: https://github.com/visualli-ai/spec

nav:
  - Home: index.md
  - Core Concepts: core-concepts.md
  - Specification: spec.md
  - Visualli SDK:
      - Overview: visualli-sdk/index.md
      - ⚛️ React:
          - 🚀 Getting Started: visualli-sdk/react/getting-started.md
          - ⚙️ Props Reference: visualli-sdk/react/props.md
          - 🧪 Examples: visualli-sdk/react/examples.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/V-logo-rgb-transparent.png
  features:
    - navigation.sections
    - navigation.tracking
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  font:
    text: Inter
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

use_directory_urls: false

extra_css:
  - stylesheets/brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
