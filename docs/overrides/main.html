{% extends "base.html" %}

{% block extrahead %}
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/assets/favicon-kit/apple-icon-180x180.png">
  <link rel="icon" type="image/png" sizes="192x192"  href="{{ base_url }}/assets/favicon-kit/android-icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}/assets/favicon-kit/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ base_url }}/assets/favicon-kit/favicon-16x16.png">
  <link rel="manifest" href="{{ base_url }}/assets/favicon-kit/manifest.json">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="{{ base_url }}/assets/favicon-kit/ms-icon-144x144.png">
  <meta name="theme-color" content="#ffffff">
{% endblock %}
