site_name: Visualli™ Specification & SDK
site_url: https://spec.visualli.ai

repo_url: https://github.com/visualli-ai/spec

docs_dir: .
site_dir: ../site

nav:
  - Home: index.md
  - 🚀 Getting Started: getting-started.md
  - 📖 Concepts: concepts.md
  - 📐 Specification: spec.md
  - ✨ Try it out!: try-it-out.md
  - ⬇️ Downloads: downloads.md
  - Visualli™ SDK:
      - Overview: visualli-sdk/index.md
      - ⚛️ React:
          - Getting Started: visualli-sdk/react/getting-started.md
          - Reference: visualli-sdk/react/props.md
  - Bindings:
      - 🔵 TypeScript: bindings/typescript.md
      - 🐍 Python: bindings/python.md
  - Contributing: contributing.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/V-spec-logo.png
  favicon: assets/favicon-kit/favicon.ico
  features:
    - navigation.sections
    - navigation.tracking
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  # Type and colour come from the Visualli design system (design-system/, copied to assets/design-system by
  # `make build-loader`): Atkinson Hyperlegible, the light / dark themes. The palette follows the reader by default.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

use_directory_urls: false

extra_css:
  - assets/design-system/index.css
  - stylesheets/brand.css

extra_javascript:
  - js/mermaid-loader.js

hooks:
  - hooks/version.py

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
