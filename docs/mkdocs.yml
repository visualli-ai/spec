site_name: Visualli Specification & SDK
site_url: https://spec.visualli.ai

repo_url: https://github.com/visualli-ai/spec

docs_dir: .
site_dir: ../site

nav:
  - Home: index.md
  - 🚀 Getting Started: getting-started.md
  - 📖 Concepts: concepts.md
  - 📐 Specification: spec.md
  - 💻 Running it locally: run-locally.md
  - Visualli SDK:
      - Overview: visualli-sdk/index.md
      - ⚛️ React:
          - Getting Started: visualli-sdk/react/getting-started.md
          - Reference: visualli-sdk/react/props.md
  - Bindings:
      - 🔵 TypeScript: bindings/typescript.md
      - 🐍 Python: bindings/python.md
  - Contributing: contributing.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/V-spec-logo.png
  favicon: assets/favicon-kit/favicon.ico
  features:
    - navigation.sections
    - navigation.tracking
    - content.tabs.link
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  font:
    text: Inter
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

use_directory_urls: false

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - js/mermaid-loader.js

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
